<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#14141B">
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
    <title>Numbers - Password Dimenticata</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="auth-shared.css">
</head>
<body>
    <div class="container">
        <div class="logo-section">
            <svg class="logo-mark" viewBox="0 0 32 32" width="48" height="48" role="img" aria-label="Numbers">
  <defs>
    <linearGradient id="numbers-n" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2bff9e"/>
      <stop offset="1" stop-color="#00b85c"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7.5" fill="#1B1B24"/>
  <rect x="0.9" y="0.9" width="30.2" height="30.2" rx="6.7" fill="none" stroke="#ffffff" stroke-opacity="0.30" stroke-width="1.6"/>
  <g fill="url(#numbers-n)">
    <path d="M9 8h3.5v16H9z"/>
    <path d="M19.5 8H23v16h-3.5z"/>
    <path d="M9 8h3.5L23 24h-3.5z"/>
  </g>
</svg>
            <div class="logo-text">Numbers</div>
        </div>

        <div class="card">
            <h2>Password dimenticata?</h2>
            <p class="subtitle">Inserisci la tua email e ti invieremo un link per resettare la password</p>

            <div id="errorMessage" class="message error"></div>
            <div id="successMessage" class="message success"></div>

            <form id="forgotForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="tua@email.com" required>
                </div>
                <button type="submit" class="btn" id="submitBtn">Invia il link</button>
            </form>

            <div class="helper-text">
                <a href="auth.html">← Torna al login</a>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        const API_URL = APP_CONFIG.API_URL;

        function showError(message) {
            const errorEl = document.getElementById('errorMessage');
            errorEl.textContent = message;
            errorEl.classList.add('active');
            document.getElementById('successMessage').classList.remove('active');
        }

        function showSuccess(message) {
            const successEl = document.getElementById('successMessage');
            successEl.textContent = message;
            successEl.classList.add('active');
            document.getElementById('errorMessage').classList.remove('active');
        }

        document.getElementById('forgotForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const btn = document.getElementById('submitBtn');

            // Disable button
            btn.disabled = true;
            btn.textContent = 'Invio in corso...';

            try {
                const response = await fetch(`${API_URL}/auth/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Errore durante la richiesta');
                }

                showSuccess('✅ ' + data.message + ' Controlla la tua email!');
                document.getElementById('forgotForm').style.display = 'none';

            } catch (error) {
                console.error('Forgot password error:', error);
                showError(error.message);
                btn.disabled = false;
                btn.textContent = 'Invia il link';
            }
        });
    </script>
</body>
</html>

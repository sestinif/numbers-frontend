<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <title>Numbers - Password Dimenticata</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="auth-shared.css">
</head>
<body>
    <div class="container">
        <div class="logo-section">
            <div class="logo-icon">N</div>
            <div class="logo-text">Numbers</div>
        </div>

        <div class="card">
            <h2>Password Dimenticata?</h2>
            <p class="subtitle">Inserisci la tua email e ti invieremo un link per resettare la password</p>

            <div id="errorMessage" class="message error"></div>
            <div id="successMessage" class="message success"></div>

            <form id="forgotForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="tua@email.com" required>
                </div>
                <button type="submit" class="btn" id="submitBtn">Invia Link Reset</button>
            </form>

            <div class="helper-text">
                <a href="auth.html">← Torna al Login</a>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        const API_URL = APP_CONFIG.API_URL;

        function showError(message) {
            const errorEl = document.getElementById('errorMessage');
            errorEl.textContent = message;
            errorEl.classList.add('active');
            document.getElementById('successMessage').classList.remove('active');
        }

        function showSuccess(message) {
            const successEl = document.getElementById('successMessage');
            successEl.textContent = message;
            successEl.classList.add('active');
            document.getElementById('errorMessage').classList.remove('active');
        }

        document.getElementById('forgotForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const btn = document.getElementById('submitBtn');

            // Disable button
            btn.disabled = true;
            btn.textContent = 'Invio in corso...';

            try {
                const response = await fetch(`${API_URL}/auth/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Errore durante la richiesta');
                }

                showSuccess('✅ ' + data.message + ' Controlla la tua email!');
                document.getElementById('forgotForm').style.display = 'none';

            } catch (error) {
                console.error('Forgot password error:', error);
                showError(error.message);
                btn.disabled = false;
                btn.textContent = 'Invia Link Reset';
            }
        });
    </script>
</body>
</html>

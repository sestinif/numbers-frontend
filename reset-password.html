<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#14141B">
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
    <title>Numbers - Reset Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="auth-shared.css">
</head>
<body>
    <div class="container">
        <div class="logo-section">
            <svg class="logo-mark" viewBox="0 0 32 32" width="48" height="48" role="img" aria-label="Numbers">
  <defs>
    <linearGradient id="numbers-n" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2bff9e"/>
      <stop offset="1" stop-color="#00b85c"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7.5" fill="#1B1B24"/>
  <rect x="0.9" y="0.9" width="30.2" height="30.2" rx="6.7" fill="none" stroke="#ffffff" stroke-opacity="0.30" stroke-width="1.6"/>
  <g fill="url(#numbers-n)">
    <path d="M9 8h3.5v16H9z"/>
    <path d="M19.5 8H23v16h-3.5z"/>
    <path d="M9 8h3.5L23 24h-3.5z"/>
  </g>
</svg>
            <div class="logo-text">Numbers</div>
        </div>

        <div class="card">
            <h2>Nuova password</h2>
            <p class="subtitle">Inserisci la tua nuova password</p>

            <div id="errorMessage" class="message error"></div>
            <div id="successMessage" class="message success"></div>

            <form id="resetForm">
                <div class="form-group">
                    <label>Nuova password</label>
                    <input type="password" id="newPassword" placeholder="Minimo 6 caratteri" required minlength="6">
                </div>
                <div class="form-group">
                    <label>Conferma password</label>
                    <input type="password" id="confirmPassword" placeholder="Ripeti la password" required>
                </div>
                <button type="submit" class="btn" id="resetBtn">Salva la password</button>
            </form>

            <div class="helper-text">
                <a href="auth.html">← Torna al login</a>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        const API_URL = APP_CONFIG.API_URL;

        // Get token from URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (!token) {
            showError('Link non valido. Token mancante.');
            document.getElementById('resetForm').style.display = 'none';
        }

        function showError(message) {
            const errorEl = document.getElementById('errorMessage');
            errorEl.textContent = message;
            errorEl.classList.add('active');
            document.getElementById('successMessage').classList.remove('active');
        }

        function showSuccess(message) {
            const successEl = document.getElementById('successMessage');
            successEl.textContent = message;
            successEl.classList.add('active');
            document.getElementById('errorMessage').classList.remove('active');
        }

        document.getElementById('resetForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // Validate passwords match
            if (newPassword !== confirmPassword) {
                showError('Le password non corrispondono');
                return;
            }

            // Disable button
            const btn = document.getElementById('resetBtn');
            btn.disabled = true;
            btn.textContent = 'Salvataggio...';

            try {
                const response = await fetch(`${API_URL}/auth/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Errore durante il reset');
                }

                showSuccess('✅ Password aggiornata con successo! Reindirizzamento al login...');
                document.getElementById('resetForm').style.display = 'none';

                // Redirect to login after 2 seconds
                setTimeout(() => {
                    window.location.href = 'auth.html';
                }, 2000);

            } catch (error) {
                console.error('Reset error:', error);
                showError(error.message);
                btn.disabled = false;
                btn.textContent = 'Salva la password';
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#14141B">
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
    <title>Numbers - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="auth-shared.css">
    <style>
        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        .error-message.active {
            animation: shake 0.5s ease;
        }

        .divider {
            text-align: center;
            margin: 32px 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 1px;
            background: var(--border-color);
        }

        .divider span {
            position: relative;
            background: var(--bg-card);
            padding: 0 16px;
            color: var(--text-secondary);
            font-size: 13px;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.active {
            display: block;
        }

        .spinner { width: 32px; height: 32px; border: 2px solid var(--border-color); border-top-color: var(--primary-green); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto; }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <!-- Logo Section -->
        <div class="logo-section">
            <div class="logo-icon">N</div>
            <div class="logo-text">Numbers</div>
            <div class="logo-tagline">Premium Invoice Management</div>
        </div>

        <!-- Auth Card -->
        <div class="auth-card">
            <!-- Error/Success Messages -->
            <div id="errorMessage" class="error-message"></div>
            <div id="successMessage" class="success-message"></div>

            <!-- Accesso con il codice solo: compare quando il server lo ha attivo (vedi /auth/mode). -->
            <div id="codeForm" class="form-section">
                <form onsubmit="handleCode(event)">
                    <div class="form-group">
                        <label for="accessCode">Codice di accesso</label>
                        <input type="password" id="accessCode" placeholder="Incolla il codice" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required>
                    </div>
                    <button type="submit" class="btn" id="codeBtn">Entra</button>
                </form>
            </div>

            <!-- Login Form -->
            <div id="loginForm" class="form-section active">
                <form onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="loginEmail" placeholder="tua@email.com" autocomplete="email" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password" required>
                    </div>
                    <button type="submit" class="btn" id="loginBtn">Accedi</button>
                </form>
                <div class="helper-text">
                    <a href="forgot-password.html">Password dimenticata?</a>
                </div>
            </div>

            <!-- Loading -->
            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p style="margin-top: 12px; color: var(--text-secondary);">Caricamento...</p>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        // API Configuration
        const API_URL = APP_CONFIG.API_URL;

        // Show error message
        function showError(message) {
            const errorEl = document.getElementById('errorMessage');
            errorEl.textContent = message;
            errorEl.classList.add('active');
            document.getElementById('successMessage').classList.remove('active');
        }

        // Show success message
        function showSuccess(message) {
            const successEl = document.getElementById('successMessage');
            successEl.textContent = message;
            successEl.classList.add('active');
            document.getElementById('errorMessage').classList.remove('active');
        }

        // Hide all messages
        function hideMessages() {
            document.getElementById('errorMessage').classList.remove('active');
            document.getElementById('successMessage').classList.remove('active');
        }

        // Show/hide loading
        function setLoading(isLoading) {
            document.getElementById('loading').classList.toggle('active', isLoading);
            if (isLoading) {
                document.querySelectorAll('.form-section').forEach(f => f.style.display = 'none');
            } else {
                // Mostra solo la form attiva, non entrambe
                document.querySelectorAll('.form-section').forEach(f => f.style.display = '');
            }
            document.querySelectorAll('.btn').forEach(btn => btn.disabled = isLoading);
        }

        // Handle Login
        async function handleLogin(e) {
            e.preventDefault();
            hideMessages();

            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            setLoading(true);

            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Errore durante il login');
                }

                // Save token and user data
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));

                showSuccess('Login effettuato! Reindirizzamento...');

                // Redirect to app
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1000);

            } catch (error) {
                console.error('Login error:', error);
                showError(error.message);
            } finally {
                setLoading(false);
            }
        }

        // Handle access with the code only
        async function handleCode(e) {
            e.preventDefault();
            hideMessages();
            const code = document.getElementById('accessCode').value;
            setLoading(true);
            try {
                const response = await fetch(`${API_URL}/auth/code`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code })
                });
                const data = await response.json().catch(() => ({}));
                if (!response.ok) throw new Error(data.error || 'Accesso non riuscito');
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                window.location.href = 'index.html';
            } catch (error) {
                document.getElementById('accessCode').value = '';
                showError(error.message);
            } finally {
                setLoading(false);
            }
        }

        // Il server dice se si entra con il codice solo o con email e password.
        // Se non risponde resta il modulo di prima: meglio di una pagina vuota.
        function showCodeOnly() {
            document.querySelectorAll('.form-section').forEach(f => f.classList.remove('active'));
            document.getElementById('codeForm').classList.add('active');
            document.getElementById('accessCode').focus();
        }
        window.addEventListener('DOMContentLoaded', async () => {
            setLoading(true);
            try {
                const res = await fetch(`${API_URL}/auth/mode`);
                const data = res.ok ? await res.json() : null;
                if (data && data.mode === 'code') showCodeOnly();
            } catch (e) { /* resta il modulo con email e password */ }
            setLoading(false);
        });

        // Check if already logged in
        window.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('token');
            if (token) {
                // Verify token is valid
                fetch(`${API_URL}/auth/me`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                })
                .then(response => {
                    if (response.ok) {
                        window.location.href = 'index.html';
                    } else {
                        // Token invalid, clear it
                        localStorage.removeItem('token');
                        localStorage.removeItem('user');
                    }
                })
                .catch(() => {
                    localStorage.removeItem('token');
                    localStorage.removeItem('user');
                });
            }
        });
    </script>
</body>
</html>
